name: train

# Manually start a training run, or promote an already-approved model package.
#
# The normal path needs neither: EventBridge can run the pipeline on a schedule
# (var.retrain_schedule_enabled), and approving a model package in the SageMaker
# console fires the model_promote Lambda. This workflow exists for on-demand runs
# and for rollback.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [start-training, promote]
        default: start-training
      mlm_epochs:
        description: "start-training: MLM pre-training epochs"
        type: string
        default: "3"
      clf_epochs:
        description: "start-training: classifier fine-tuning epochs"
        type: string
        default: "3"
      training_instance_type:
        description: "start-training: instance type for both training steps"
        type: string
        default: "ml.g4dn.xlarge"
      macro_f1_threshold:
        description: "start-training: minimum macro F1 required to register a model"
        type: string
        default: "0.80"
      model_package_arn:
        description: "promote: package ARN to deploy. Empty promotes the most recently approved one — set it to roll back to an older version."
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: finsense-train
  cancel-in-progress: false

jobs:
  start-training:
    if: inputs.job == 'start-training'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Init
        working-directory: terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Start pipeline execution
        run: |
          set -euo pipefail
          PIPELINE=$(terraform -chdir=terraform output -raw pipeline_name)
          DATA_BUCKET=$(terraform -chdir=terraform output -raw data_bucket_name)
          GROUP=$(terraform -chdir=terraform output -raw model_package_group_name)

          # Only the parameters this workflow overrides; the rest fall back to the
          # defaults compiled into the pipeline definition.
          PARAMS=$(jq -nc \
            --arg bucket "$DATA_BUCKET" \
            --arg group "$GROUP" \
            --arg mlm "${{ inputs.mlm_epochs }}" \
            --arg clf "${{ inputs.clf_epochs }}" \
            --arg instance "${{ inputs.training_instance_type }}" \
            --arg threshold "${{ inputs.macro_f1_threshold }}" \
            '[{Name:"DataBucket",Value:$bucket},
              {Name:"ModelPackageGroup",Value:$group},
              {Name:"MlmEpochs",Value:$mlm},
              {Name:"ClfEpochs",Value:$clf},
              {Name:"TrainingInstanceType",Value:$instance},
              {Name:"MacroF1Threshold",Value:$threshold}]')

          ARN=$(aws sagemaker start-pipeline-execution \
            --pipeline-name "$PIPELINE" \
            --pipeline-parameters "$PARAMS" \
            --query PipelineExecutionArn --output text)

          echo "::notice::Started $ARN"
          {
            echo "### Training run started"
            echo ""
            echo "Pipeline: \`$PIPELINE\`"
            echo "Execution: \`$ARN\`"
            echo ""
            echo "A model package is registered only if macro F1 reaches ${{ inputs.macro_f1_threshold }}."
            echo "It lands as **PendingManualApproval** — approve it to deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: inputs.job == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Invoke model_promote
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc --arg arn "${{ inputs.model_package_arn }}" \
            'if $arn == "" then {} else {model_package_arn: $arn} end')

          aws lambda invoke \
            --function-name finsense-model-promote \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            --log-type Tail \
            --query LogResult --output text response.json | base64 -d

          echo "### Promotion result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat response.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # `aws lambda invoke` exits 0 even when the function raised.
          if jq -e 'has("errorMessage")' response.json >/dev/null; then
            echo "::error::model_promote failed: $(jq -r .errorMessage response.json)"
            exit 1
          fi
