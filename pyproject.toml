[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finsense-training"
version = "0.1.0"
description = "Training pipeline for FinSense (BERT / FinBERT, MLM, pseudo-labeling)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.0.0,<6",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "numpy>=1.23.0",
    "tqdm>=4.65.0",
    "openai>=1.12.0",
    "google-genai>=1.73.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "boto3>=1.28.0"]
# Local build of pipeline_definition.json (sagemaker.workflow.*); use SDK v2 only.
pipeline = ["sagemaker>=2.200,<3", "boto3>=1.28.0"]

[project.scripts]
finsense-pseudo-label = "training.pseudo_label:main"
finsense-train-classifier = "training.train_classifier:main"
finsense-train-mlm = "training.train_mlm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "infra/lambda/_layer/python"]
testpaths = ["tests"]
