[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finsense-training"
version = "0.1.0"
description = "Training pipeline for FinSense (BERT / FinBERT, MLM, pseudo-labeling)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers==5.5.3",
    "datasets==3.2.0",
    "accelerate==1.4.0",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "numpy==2.1.3",
    "tqdm==4.67.1",
    "wget==3.2",
    "openai==1.59.6",
    "google-generativeai==0.8.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finsense-pseudo-label = "training.pseudo_label:main"
finsense-train-classifier = "training.train_classifier:main"
finsense-train-mlm = "training.train_mlm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
