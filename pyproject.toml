[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sentiment-training"
version = "0.1.0"
description = "Training pipeline for MarketSentimentModel (BERT / FinBERT, MLM, pseudo-labeling)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.0.0,<6",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "numpy>=1.23.0",
    "tqdm>=4.65.0",
    "wget>=3.2",
    "openai>=1.12.0",
    "google-generativeai>=0.8.0",
]

[project.scripts]
ms-pseudo-label = "training.pseudo_label:main"
ms-train-classifier = "training.train_classifier:main"
ms-train-mlm = "training.train_mlm:main"

[tool.setuptools.packages.find]
where = ["src"]
