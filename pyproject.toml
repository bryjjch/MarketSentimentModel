[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finsense-training"
version = "0.1.0"
description = "Training pipeline for FinSense (BERT / FinBERT, MLM, pseudo-labeling)"
readme = "README.md"
requires-python = ">=3.10"
# Intentionally empty: every environment this repo needs is an extra below, so the
# deploy job can install the SageMaker SDK without dragging in torch. Installing the
# bare project gives you the console scripts but nothing to run them with — use
# `pip install -e ".[train,dev]"`.
dependencies = []

# Pins are exact because these describe reproducible environments, not a library's
# compatible range. Nothing here is published to PyPI.
[project.optional-dependencies]
# Local/CI training and pseudo-labeling. Not what the cloud runs: SageMaker training
# happens in the AWS DLC pinned by TrainImageUri in pipeline_definition.py, which
# installs none of this.
train = [
    "torch==2.13.0",
    "transformers==5.10.1",
    "datasets==3.2.0",
    "accelerate==1.4.0",
    "numpy==2.1.3",
    # >=2.3.0 so this is co-installable with `pipeline` (sagemaker 2.x needs it).
    "pandas==2.3.3",
    "scikit-learn==1.5.2",
    "tqdm==4.67.1",
    "wget==3.2",
    "openai==1.59.6",
    "google-genai==1.73.1",
]
# Inference-only stack (CPU wheels), for exercising src/sagemaker/serving/code
# locally. The deployed endpoint uses the InferenceImageUri DLC instead; adding a
# requirements.txt under serving/code/ is what would make the DLC install pins.
serve = [
    "torch==2.13.0",
    "transformers==5.10.1",
    "numpy==2.1.3",
    "safetensors==0.4.5",
]
# Builds and upserts pipeline_definition.json. SDK v2 only: v3+ splits/removes the
# legacy `sagemaker.workflow.*` API that pipeline_definition.py is written against.
pipeline = ["sagemaker>=2.200,<3", "boto3>=1.28.0"]
dev = ["pytest>=8.0", "boto3>=1.28.0"]

[project.scripts]
finsense-pseudo-label = "training.pseudo_label:main"
finsense-train-classifier = "training.train_classifier:main"
finsense-train-mlm = "training.train_mlm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/lambdas"]
testpaths = ["tests"]
